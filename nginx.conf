# F1d — Ephemeral preview links (PLAN_SYSTEM_TASKS.md Phase F /
# UBIQ_ENHANCEMENT_ROADMAP.md "Ephemeral preview links").
#
# `resolver` is required for nginx to resolve a proxy_pass target that's
# a *variable* (as opposed to a literal hostname baked in at config-parse
# time) at request time. 127.0.0.11 is Docker's embedded DNS, reachable
# from any container on a user-defined bridge network — this is what lets
# `proxy_pass http://$target_host:$target_port;` below resolve a sandbox
# container's name to its current IP on every request, the same way any
# other container-to-container traffic on `ubiq_sandbox` already does
# (see docker-compose.yml's note on that network, and the near-identical
# pattern TerminalController::execute() uses server-side via fsockopen).
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    # Regex server_name — matches preview-{token}.ubiq-editor.space and
    # captures the token into $preview_token. This needs the one-time
    # wildcard cert (*.ubiq-editor.space via certbot DNS-01) at whichever
    # layer terminates TLS for this domain, same as the plain `listen 80`
    # server blocks below assume for their own domains already (this
    # container sits behind that TLS termination, reachable only via
    # 127.0.0.1:8082 — see docker-compose.yml).
    server_name ~^preview-(?<preview_token>[a-z0-9-]+)\.ubiq-editor\.space$;

    # Internal-only: resolves a preview token to the sandbox container
    # this request should actually be proxied to. Not reachable directly
    # by a client — `internal` below rejects any request that didn't
    # arrive via the auth_request mechanism in the location block further
    # down. Talks fastcgi straight to Laravel, same as every `.php`
    # request the api.* server block below handles — this is NOT proxied
    # through the public /api/v1/... route via a redirect or rewrite;
    # this IS that route's real path, matched directly by SCRIPT_FILENAME
    # + REQUEST_URI below instead of round-tripping through the api.*
    # server block. Must match routes/api.php's actual registered path
    # exactly: bootstrap/app.php's `api:` entry gives every route in
    # that file an implicit `/api` prefix, and the file's own
    # `Route::prefix('v1')` group adds `/v1` on top — so the real,
    # effective path Laravel matches is `/api/v1/internal/preview-resolve`,
    # not the bare `/internal/preview-resolve` the route definition alone
    # suggests.
    location = /api/v1/internal/preview-resolve {
        internal;

        # The regex capture above is what tells Laravel which run this
        # request is for — passed as a request header rather than having
        # PreviewResolveController re-derive it from the Host header
        # itself, so "which part of the subdomain is the token" is
        # parsed in exactly one place (this regex), not duplicated in
        # PHP too.
        fastcgi_param HTTP_X_PREVIEW_TOKEN $preview_token;

        # `include fastcgi_params;` MUST come before the fastcgi_param
        # overrides below, not after. nginx's stock fastcgi_params file
        # sets REQUEST_URI/DOCUMENT_URI/SCRIPT_NAME from the CLIENT's
        # actual request ($request_uri is "full original request URI" —
        # for an auth_request subrequest that's still the outer page's
        # own URL, e.g. "/" or "/favicon.ico", NOT this location's own
        # "/api/v1/internal/preview-resolve" path). nginx uses
        # last-directive-wins for duplicate fastcgi_param names, so
        # putting the include AFTER the manual values (as this block
        # used to) silently clobbered REQUEST_URI back to the visitor's
        # own URL — Laravel then routed on THAT path instead of ever
        # reaching PreviewResolveController: "/" matched
        # routes/web.php's welcome route (200, no X-Target-* headers →
        # "invalid port in upstream ':'"), anything else 404'd ("auth
        # request unexpected status: 404"). Fixed by including first,
        # then overriding REQUEST_URI/DOCUMENT_URI/SCRIPT_NAME
        # explicitly so nothing downstream can reset them.
        include                 fastcgi_params;

        fastcgi_pass            api:9000;
        fastcgi_index           index.php;
        fastcgi_param           SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param           SCRIPT_NAME     /api/v1/internal/preview-resolve;
        fastcgi_param           REQUEST_URI     /api/v1/internal/preview-resolve;
        fastcgi_param           DOCUMENT_URI    /api/v1/internal/preview-resolve;
        fastcgi_param           REQUEST_METHOD  GET;
        fastcgi_param           QUERY_STRING    "";
        fastcgi_read_timeout    5s;
        fastcgi_connect_timeout 5s;
    }

    location / {
        # auth_request fires the resolve endpoint above as a subrequest
        # before this location proxies anything. A non-2xx response there
        # (invalid/stale token, run stopped, legacy row with no
        # internal_port — see PreviewResolveController::resolve()) makes
        # nginx return that same status to the visitor and never reaches
        # proxy_pass at all — this is the actual token gate; nothing
        # downstream of it re-checks auth.
        auth_request /api/v1/internal/preview-resolve;

        # Pull PreviewResolveController's X-Target-Host / X-Target-Port
        # response headers into nginx variables so proxy_pass below can
        # use them. This is the standard nginx dynamic-upstream trick —
        # there's no way to ask PHP-FPM "what's the real backend" and
        # then proxy to it in one step otherwise.
        auth_request_set $target_host $upstream_http_x_target_host;
        auth_request_set $target_port $upstream_http_x_target_port;

        proxy_pass http://$target_host:$target_port;
        proxy_http_version 1.1;
        # Vite/webpack HMR and most dev servers this proxies to run a
        # websocket alongside the plain HTTP dev server — without this
        # upgrade plumbing, the page loads but live-reload silently
        # doesn't work, which would be a confusing, hard-to-diagnose gap
        # between "sandbox preview" and "what RUN actually built".
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Same shape as PreviewResolveController's own 403 — auth_request
    # failing already stops the visitor from reaching proxy_pass; this
    # just gives the 403 nginx would otherwise return a plain body
    # instead of an empty one. Deliberately NOT 404 here: nginx's
    # auth_request module only ever passes through 2xx, 401, or 403 from
    # the subrequest — any other status (404 included) gets converted
    # into a flat, unrecoverable 500 before error_page even sees it, so
    # PreviewResolveController::deny() returns 403 specifically so this
    # mapping can actually fire.
    error_page 401 403 = @preview_not_found;
    location @preview_not_found {
        default_type text/plain;
        return 404 "This preview link is invalid or no longer active.\n";
    }
}

server {
    listen 80;
    server_name ubiq-editor.space www.ubiq-editor.space;

    # Proxies to the `frontend` container (its own nginx, serving the built
    # Vite dist from frontend/Dockerfile) rather than serving static files
    # from a local root — this nginx service has no volume/build step that
    # puts the built assets anywhere on its own filesystem, so `root` here
    # would point at a directory that doesn't exist. `frontend` is already
    # on `ubiq-net` alongside this service, so it resolves by container name
    # via Docker's embedded DNS, same as `api:9000` does for fastcgi below.
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.ubiq-editor.space;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Ollama proxy — extended timeouts
    location ~ ^/api/v1/ollama/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "https://ubiq-editor.space" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS"          always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Max-Age       86400                          always;
            add_header Content-Length 0;
            return 204;
        }

        fastcgi_pass            api:9000;
        fastcgi_index           index.php;
        fastcgi_param           SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include                 fastcgi_params;
        fastcgi_read_timeout    320s;
        fastcgi_send_timeout    320s;
        fastcgi_connect_timeout 10s;
    }

    location ~ \.php$ {
        fastcgi_pass            api:9000;
        fastcgi_index           index.php;
        fastcgi_param           SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include                 fastcgi_params;
        fastcgi_read_timeout    120s;
    }

    location ~ /\.ht {
        deny all;
    }
}