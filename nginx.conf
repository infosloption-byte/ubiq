server {
    listen 80;
    server_name ubiq-editor.space api.ubiq-editor.space;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ubiq-editor.space;
    ssl_certificate /etc/letsencrypt/live/ubiq-editor.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ubiq-editor.space/privkey.pem;
    root /var/www/frontend;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name api.ubiq-editor.space;
    ssl_certificate /etc/letsencrypt/live/ubiq-editor.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ubiq-editor.space/privkey.pem;
    root /var/www/html/public;
    index index.php;
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Ollama proxy — extended timeouts + CORS preflight ────────────────────
    location ~ ^/api/v1/ollama/ {
 
        # Handle CORS preflight (OPTIONS) directly in nginx — no PHP round-trip
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "https://ubiq-editor.space" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS"         always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Max-Age       86400                         always;
            add_header Content-Length 0;
            return 204;
        }
 
        fastcgi_pass            api:9000;
        fastcgi_index           index.php;
        fastcgi_param           SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include                 fastcgi_params;
        fastcgi_read_timeout    320s;
        fastcgi_send_timeout    320s;
        fastcgi_connect_timeout 10s;
    }

    location ~ \.php$ {
        fastcgi_pass api:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
