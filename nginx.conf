server {
    listen 80;
    server_name ubiq-editor.space www.ubiq-editor.space;

    root /var/www/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

server {
    listen 80;
    server_name api.ubiq-editor.space;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Ollama proxy — extended timeouts
    location ~ ^/api/v1/ollama/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "https://ubiq-editor.space" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS"          always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Max-Age       86400                          always;
            add_header Content-Length 0;
            return 204;
        }

        fastcgi_pass            api:9000;
        fastcgi_index           index.php;
        fastcgi_param           SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include                 fastcgi_params;
        fastcgi_read_timeout    320s;
        fastcgi_send_timeout    320s;
        fastcgi_connect_timeout 10s;
    }

    location ~ \.php$ {
        fastcgi_pass            api:9000;
        fastcgi_index           index.php;
        fastcgi_param           SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include                 fastcgi_params;
        fastcgi_read_timeout    120s;
    }

    location ~ /\.ht {
        deny all;
    }
}
