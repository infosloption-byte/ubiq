server {
    listen 80;
    server_name ubiq-editor.space api.ubiq-editor.space;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ubiq-editor.space;
    ssl_certificate /etc/letsencrypt/live/ubiq-editor.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ubiq-editor.space/privkey.pem;
    root /var/www/frontend;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name api.ubiq-editor.space;
    ssl_certificate /etc/letsencrypt/live/ubiq-editor.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ubiq-editor.space/privkey.pem;
    root /var/www/html/public;
    index index.php;
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ~ \.php$ {
        fastcgi_pass api:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
