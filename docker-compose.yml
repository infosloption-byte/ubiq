version: '3.8'

# FIX #9: Docker socket proxy.
#
# The previous config mounted /var/run/docker.sock directly into ubiq_api,
# giving any code running inside Laravel full Docker daemon access — equivalent
# to root on the host. A single successful injection through any Laravel
# vulnerability becomes a complete host compromise.
#
# The fix: add a socket-proxy sidecar (tecnativa/docker-socket-proxy) that
# sits between ubiq_api and the real Docker daemon. The proxy accepts only the
# specific API calls that Laravel actually needs (POST /containers/*, DELETE
# /containers/*, GET /containers/*) and rejects everything else — including
# image pulls, exec into other containers, daemon info, and swarm commands.
#
# ubiq_api now connects to DOCKER_HOST=tcp://socket-proxy:2375 instead of
# mounting /var/run/docker.sock. The real socket is only mounted into the
# proxy sidecar, which runs in its own isolated network that ubiq_api cannot
# reach directly.

services:

  # ── Docker socket proxy ────────────────────────────────────────────────────
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0   # pin a specific release for reproducibility
    container_name: ubiq_socket_proxy
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro   # proxy gets the socket read-only
    environment:
      CONTAINERS: 1
      POST:       1
      DELETE:     1
      IMAGES:     0
      NETWORKS:   0
      VOLUMES:    0
      EXEC:       0
      BUILD:      0
      COMMIT:     0
      CONFIGS:    0
      DISTRIBUTION: 0
      INFO:       0
      PING:       0
      SECRETS:    0
      SESSION:    0
      SWARM:      0
      SYSTEM:     0
      TASKS:      0
      VERSION:    0
    networks:
      - proxy-net       # isolated network: only socket-proxy + ubiq_api can join

  # ── MySQL (LOCAL — no longer used) ──────────────────────────────────────────
  # ubiq now points at shared_mysql (172.17.0.1:3306, see the api service below),
  # the same shared MySQL instance used by Voxora. This local container and its
  # volume are kept only as a fallback; safe to delete once shared_mysql is
  # confirmed working end-to-end.
  # mysql:
  #   image: mysql:8.0
  #   container_name: ubiq_mysql
  #   restart: always
  #   environment:
  #     MYSQL_ROOT_PASSWORD: root
  #     MYSQL_DATABASE: ubiq
  #     MYSQL_USER: ubiq_user
  #     MYSQL_PASSWORD: 123456
  #   volumes:
  #     - db_data:/var/lib/mysql
  #   networks:
  #     - ubiq-net
  #   command: --default-authentication-plugin=mysql_native_password

  # ── Laravel API ────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ubiq_api
    restart: always
    volumes:
      - ./backend:/var/www/html
      # NOTE: /var/run/docker.sock is NO LONGER mounted here.
      # Laravel now reaches Docker via the proxy over TCP.
    environment:
      APP_ENV:     production
      # Tell Laravel/Process::run() to talk to the socket proxy instead of the daemon.
      DOCKER_HOST: tcp://socket-proxy:2375
      # Shared MySQL (same instance used by Voxora), reached via the Docker
      # bridge gateway IP rather than a container name, since shared_mysql
      # lives on a different compose project's network.
      DB_CONNECTION: mysql
      DB_HOST: 172.17.0.1
      DB_PORT: 3306
      DB_DATABASE: ubiq
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - socket-proxy
    networks:
      - ubiq-net
      - proxy-net   # must be on proxy-net to reach socket-proxy

  # ── Nginx ─────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ubiq_nginx
    restart: always
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ./backend:/var/www/html
      - ./frontend/dist:/var/www/frontend
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    networks:
      - ubiq-net

volumes:
  db_data:

networks:
  ubiq-net:
    driver: bridge

  proxy-net:
    driver: bridge
    internal: true    # no external internet access on this network
