version: '3.8'

# FIX #9: Docker socket proxy.
#
# The previous config mounted /var/run/docker.sock directly into ubiq_api,
# giving any code running inside Laravel full Docker daemon access — equivalent
# to root on the host. A single successful injection through any Laravel
# vulnerability becomes a complete host compromise.
#
# The fix: add a socket-proxy sidecar (tecnativa/docker-socket-proxy) that
# sits between ubiq_api and the real Docker daemon. The proxy accepts only the
# specific API calls that Laravel actually needs (POST /containers/*, DELETE
# /containers/*, GET /containers/*) and rejects everything else — including
# image pulls, exec into other containers, daemon info, and swarm commands.
#
# ubiq_api now connects to DOCKER_HOST=tcp://socket-proxy:2375 instead of
# mounting /var/run/docker.sock. The real socket is only mounted into the
# proxy sidecar, which runs in its own isolated network that ubiq_api cannot
# reach directly.

services:

  # ── Docker socket proxy ────────────────────────────────────────────────────
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0   # pin a specific release for reproducibility
    container_name: ubiq_socket_proxy
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro   # proxy gets the socket read-only
    environment:
      CONTAINERS: 1
      POST:       1
      DELETE:     1
      IMAGES:     1
      NETWORKS:   0
      VOLUMES:    0
      EXEC:       0
      BUILD:      0
      COMMIT:     0
      CONFIGS:    0
      DISTRIBUTION: 0
      INFO:       0
      PING:       1
      SECRETS:    0
      SESSION:    0
      SWARM:      0
      SYSTEM:     0
      TASKS:      0
      VERSION:    0
    networks:
      - proxy-net       # isolated network: only socket-proxy + ubiq_api can join

  # ── MySQL (LOCAL — no longer used) ──────────────────────────────────────────
  # ubiq now points at shared_mysql (172.17.0.1:3306, see the api service below),
  # the same shared MySQL instance used by Voxora. This local container and its
  # volume are kept only as a fallback; safe to delete once shared_mysql is
  # confirmed working end-to-end.
  # mysql:
  #   image: mysql:8.0
  #   container_name: ubiq_mysql
  #   restart: always
  #   environment:
  #     MYSQL_ROOT_PASSWORD: root
  #     MYSQL_DATABASE: ubiq
  #     MYSQL_USER: ubiq_user
  #     MYSQL_PASSWORD: 123456
  #   volumes:
  #     - db_data:/var/lib/mysql
  #   networks:
  #     - ubiq-net
  #   command: --default-authentication-plugin=mysql_native_password

  # ── Laravel API ────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ubiq_api
    restart: always
    volumes:
      - ./backend:/var/www/html
      # NOTE: /var/run/docker.sock is NO LONGER mounted here.
      # Laravel now reaches Docker via the proxy over TCP.
    environment:
      APP_ENV:     production
      # Tell Laravel/Process::run() to talk to the socket proxy instead of the daemon.
      DOCKER_HOST: tcp://socket-proxy:2375
      # Shared MySQL (same instance used by Voxora). Reached by container name
      # now that this service is attached to shared_net directly, instead of
      # the previous (broken) bridge-gateway-IP approach.
      DB_CONNECTION: mysql
      DB_HOST: mysql_shared
      DB_PORT: 3306
      DB_DATABASE: ubiq
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - socket-proxy
    networks:
      - ubiq-net
      - proxy-net     # must be on proxy-net to reach socket-proxy
      - shared_net    # must be on shared_net to reach mysql_shared by name
      # F0d: must be on this network to reach each sandbox container's
      # exec listener by name (see TerminalController::execute()).
      # Joining a static compose network membership like this is applied
      # directly by `docker compose up` against the real daemon, not
      # through ubiq_api's own restricted DOCKER_HOST=socket-proxy
      # connection at runtime — so this has no relationship to
      # EXEC/NETWORKS being 0 on the proxy below. Laravel gains the
      # ability to open a plain TCP connection to containers on this
      # network (already true of every other service port any sandbox
      # container publishes on it — see the `ubiq_sandbox` network note
      # further down), not any new Docker-daemon capability.
      - ubiq_sandbox

  # ── Frontend (Vite build -> its own nginx) ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_PAYPAL_CLIENT_ID: ${VITE_PAYPAL_CLIENT_ID}
        VITE_PAYPAL_PLAN_ID: ${VITE_PAYPAL_PLAN_ID}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN}
    container_name: ubiq_frontend
    restart: always
    networks:
      - ubiq-net

  # ── Nginx (reverse proxy: routes to frontend container + fastcgi to api) ──
  nginx:
    image: nginx:alpine
    container_name: ubiq_nginx
    restart: always
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ./backend:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
      - frontend
    networks:
      - ubiq-net
      # F1d: same pattern F0d already established for ubiq_api — nginx
      # needs to reach each sandbox container directly by name to proxy
      # preview-{token}.ubiq-editor.space to it (see nginx.conf's
      # `preview-` server block). This is what lets the app container
      # stop publishing a host port at all: nginx is now the only thing
      # that talks to it, over this network, never via a host:port.
      - ubiq_sandbox

volumes:
  db_data:

networks:
  ubiq-net:
    driver: bridge

  proxy-net:
    driver: bridge
    internal: true    # no external internet access on this network

  shared_net:
    external: true    # pre-existing network that mysql_shared/pma_shared live on

  # F0d: pre-existing network created by ubiq_docker_setup.sh, already
  # joined by every sandbox container via `--network=ubiq_sandbox` in
  # ProjectController::runProject()/startDbContainer(). Every container
  # on it is already reachable from every other container on it by name
  # (Docker's embedded DNS) — that's how the F1c `db` alias and the
  # app's own service ports already work today. Adding ubiq_api here
  # doesn't change that trust boundary, just lets Laravel participate in
  # it too, for the one new reason it needs to (F0d's exec listener).
  ubiq_sandbox:
    external: true